version: 2

models:
  - name: dim_city
    columns:
      - name: city_key
        data_tests: [unique, not_null]

  - name: dim_datetime
    columns:
      - name: datetime_key
        data_tests: [unique, not_null]

  - name: fact_historical_actuals
    columns:
      - name: city_key
        data_tests: [not_null]
      - name: datetime_key
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_key, datetime_key]

  - name: fact_forecast
    columns:
      - name: lead_time_hours
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_key, datetime_key, fetched_at]

  - name: fact_forecast_accuracy
    description: "One row per prediction that has a matching actual, with error metrics by lead time."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_key, datetime_key, fetched_at]

  - name: agg_forecast_accuracy_by_lead_time
    description: "Forecast error metrics per city and lead-time hour. Source table for the Superset accuracy dashboard."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_name, lead_time_hour_bucket]