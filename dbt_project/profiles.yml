weather_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5433') | as_number }}"
      user: "{{ env_var('DBT_USER', 'weather_user') }}"
      password: "{{ env_var('DBT_PASSWORD', 'weather_pass') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'weather_db') }}"
      schema: dbt_dev
      threads: 4